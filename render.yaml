services:
  - type: web
    name: skill-orbit-india
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py wsgi:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Set this in the Render dashboard; never store database credentials in Git.
      - key: DATABASE_URL
        sync: false
      # Enable only for one-time initial admin creation, then set it back to false.
      - key: ADMIN_BOOTSTRAP_ENABLED
        value: "false"
