<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="Hardware Product Component">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="pcb-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(99, 102, 241, 0.08)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="rgba(99, 102, 241, 0.15)"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" rx="16" fill="url(#bg-grad)"/>
  <rect width="400" height="300" rx="16" fill="url(#pcb-grid)"/>

  <!-- PCB Board Outline -->
  <g transform="translate(70, 45)">
    <!-- Main PCB Base -->
    <rect x="0" y="0" width="260" height="210" rx="12" fill="#132338" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5"/>

    <!-- Left Header Pins -->
    <g fill="url(#copper)">
      <rect x="-6" y="24" width="8" height="6" rx="1"/>
      <rect x="-6" y="38" width="8" height="6" rx="1"/>
      <rect x="-6" y="52" width="8" height="6" rx="1"/>
      <rect x="-6" y="66" width="8" height="6" rx="1"/>
      <rect x="-6" y="80" width="8" height="6" rx="1"/>
      <rect x="-6" y="94" width="8" height="6" rx="1"/>
      <rect x="-6" y="108" width="8" height="6" rx="1"/>
      <rect x="-6" y="122" width="8" height="6" rx="1"/>
      <rect x="-6" y="136" width="8" height="6" rx="1"/>
      <rect x="-6" y="150" width="8" height="6" rx="1"/>
      <rect x="-6" y="164" width="8" height="6" rx="1"/>
      <rect x="-6" y="178" width="8" height="6" rx="1"/>
    </g>

    <!-- Right Header Pins -->
    <g fill="url(#copper)">
      <rect x="258" y="24" width="8" height="6" rx="1"/>
      <rect x="258" y="38" width="8" height="6" rx="1"/>
      <rect x="258" y="52" width="8" height="6" rx="1"/>
      <rect x="258" y="66" width="8" height="6" rx="1"/>
      <rect x="258" y="80" width="8" height="6" rx="1"/>
      <rect x="258" y="94" width="8" height="6" rx="1"/>
      <rect x="258" y="108" width="8" height="6" rx="1"/>
      <rect x="258" y="122" width="8" height="6" rx="1"/>
      <rect x="258" y="136" width="8" height="6" rx="1"/>
      <rect x="258" y="150" width="8" height="6" rx="1"/>
      <rect x="258" y="164" width="8" height="6" rx="1"/>
      <rect x="258" y="178" width="8" height="6" rx="1"/>
    </g>

    <!-- Circuit Traces -->
    <g stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" fill="none" stroke-linejoin="round">
      <path d="M 6 30 L 35 30 L 45 40 L 70 40"/>
      <path d="M 6 70 L 40 70 L 55 85 L 70 85"/>
      <path d="M 6 150 L 30 150 L 50 130 L 70 130"/>
      <path d="M 254 30 L 225 30 L 215 40 L 190 40"/>
      <path d="M 254 110 L 220 110 L 205 95 L 190 95"/>
      <path d="M 254 165 L 225 165 L 205 145 L 190 145"/>
    </g>

    <!-- Circuit Solder Pads -->
    <g fill="#38bdf8" opacity="0.6">
      <circle cx="35" cy="30" r="2.5"/>
      <circle cx="40" cy="70" r="2.5"/>
      <circle cx="30" cy="150" r="2.5"/>
      <circle cx="225" cy="30" r="2.5"/>
      <circle cx="220" cy="110" r="2.5"/>
      <circle cx="225" cy="165" r="2.5"/>
    </g>

    <!-- Central Microcontroller Chip -->
    <g transform="translate(70, 45)">
      <rect x="0" y="0" width="120" height="120" rx="8" fill="url(#chip-grad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
      
      <!-- Chip Core Glow and Icon -->
      <rect x="25" y="25" width="70" height="70" rx="6" fill="#0b1220" stroke="url(#accent-cyan)" stroke-width="1.5"/>
      
      <!-- Microchip CPU Symbol -->
      <g stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round">
        <rect x="42" y="42" width="36" height="36" rx="3" stroke="#60a5fa"/>
        <!-- CPU Core Lines -->
        <path d="M 48 36 L 48 42 M 60 36 L 60 42 M 72 36 L 72 42"/>
        <path d="M 48 78 L 48 84 M 60 78 L 60 84 M 72 78 L 72 84"/>
        <path d="M 36 48 L 42 48 M 36 60 L 42 60 M 36 72 L 42 72"/>
        <path d="M 78 48 L 84 48 M 78 60 L 84 60 M 78 72 L 84 72"/>
      </g>
      <circle cx="60" cy="60" r="4" fill="#38bdf8"/>

      <!-- Text on chip -->
      <text x="60" y="108" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">SKILL ORBIT</text>
    </g>

    <!-- Status LEDs -->
    <circle cx="25" cy="190" r="3.5" fill="#22c55e"/>
    <circle cx="25" cy="190" r="6" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
    <text x="35" y="193" font-family="system-ui, sans-serif" font-size="7" font-weight="500" fill="#64748b">PWR</text>

    <circle cx="65" cy="190" r="3.5" fill="#3b82f6"/>
    <circle cx="65" cy="190" r="6" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <text x="75" y="193" font-family="system-ui, sans-serif" font-size="7" font-weight="500" fill="#64748b">ACT</text>

    <!-- USB / Port outline -->
    <rect x="180" y="180" width="60" height="20" rx="3" fill="#1e293b" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <rect x="195" y="186" width="30" height="8" rx="2" fill="#334155"/>
  </g>

  <!-- Bottom Hardware Label -->
  <text x="200" y="280" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">HARDWARE COMPONENT</text>
</svg>
