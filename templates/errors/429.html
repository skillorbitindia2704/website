{% extends "base.html" %}
{% block title %}Too Many Requests - Skill Orbit India{% endblock %}
{% block content %}
<div class="error-container py-5 my-5 text-center">
  <div class="error-code display-1 text-info fw-bold mb-3" style="font-size: 6rem; background: linear-gradient(135deg, #0ea5e9, #0284c7); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">429</div>
  <h1 class="error-title h2 mb-3 fw-bold">Too Many Requests</h1>
  <p class="error-message text-muted mb-4 max-w-md mx-auto" style="max-width: 480px;">You've reached our request rate limits. Please slow down and wait a minute before making further requests to the platform.</p>
  <a href="{{ url_for('main.home') }}" class="btn btn-primary px-4 py-2" style="border-radius: 8px;">Go to Homepage</a>
</div>
{% endblock %}
