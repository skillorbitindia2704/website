# Optimized Production Nginx Configuration for Skill Orbit India

# Rate limiting zones for DDoS protection
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=store_limit:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name skillorbitindia.com www.skillorbitindia.com;

    # Enforce global HTTPS redirection
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name skillorbitindia.com www.skillorbitindia.com;

    # SSL Certificate Settings (to be filled on server)
    # ssl_certificate /etc/letsencrypt/live/skillorbitindia.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/skillorbitindia.com/privkey.pem;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Maximum client upload payload limit (matches MAX_CONTENT_LENGTH)
    client_max_body_size 128M;

    # Enable compression (Gzip)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/xml+rss image/svg+xml;

    # Security Headers fallback configurations
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com https://api.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.razorpay.com; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://www.google.com;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # static assets offloading with high caching
    location /static/ {
        alias /app/static/;
        expires 365d;
        add_header Cache-Control "public, no-transform, max-age=31536000";
        access_log off;
    }

    # Uploaded resumes and secure documents
    location /static/uploads/ {
        alias /app/static/uploads/;
        # Disable execution of scripts within upload directories for security
        location ~* \.(php|pl|py|jsp|sh|cgi)$ {
            deny all;
        }
        expires 30d;
        add_header Cache-Control "private, no-transform, max-age=2592000";
    }

    # Reverse proxy routing for dynamic Flask server
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Inject custom Request ID for microservice/upstream tracing
        proxy_set_header X-Request-ID $request_id;
        
        # Enable HTTP/1.1 and keepalive support
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Buffering parameters for chunked video streaming
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
